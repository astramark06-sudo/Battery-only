name: BatteryScope signing preflight tests

on:
  pull_request:
    paths:
      - "BatteryScope/tools/**"
      - ".github/workflows/batteryscope-signing-preflight.yml"
  push:
    branches: [fix/apk-update-preflight, main]
    paths:
      - "BatteryScope/tools/**"
      - ".github/workflows/batteryscope-signing-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test conservative package, version and certificate policy
        working-directory: BatteryScope/tools
        run: python3 -m unittest -v
