name: BatteryScope Android

on:
  push:
    branches: [main]
    paths:
      - "BatteryScope/app/**"
      - "BatteryScope/build.gradle.kts"
      - "BatteryScope/settings.gradle.kts"
      - "BatteryScope/gradle.properties"
      - ".github/workflows/batteryscope-android.yml"
  pull_request:
    paths:
      - "BatteryScope/app/**"
      - "BatteryScope/build.gradle.kts"
      - "BatteryScope/settings.gradle.kts"
      - "BatteryScope/gradle.properties"
      - ".github/workflows/batteryscope-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batteryscope-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, unit test and inspect APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's legacy default includes the retired "tools" package.
          # Request only platform-tools; command-line tools are installed by the action.
          packages: platform-tools

      - name: Install Android 35 SDK packages
        run: |
          # Keep the SDK manager's exit code while avoiding SIGPIPE from yes.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Run JVM unit tests and assemble debug APK
        working-directory: BatteryScope
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verify APK metadata and checksum
        working-directory: BatteryScope
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.batteryscope'" apk-badging.txt
          grep -q "versionCode='16'" apk-badging.txt
          grep -q "versionName='1.15'" apk-badging.txt
          grep -Fxq "application-debuggable" apk-badging.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          expected = {
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_SPECIAL_USE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.WAKE_LOCK",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          }
          lines = Path("apk-badging.txt").read_text().splitlines()
          actual = set()
          for line in lines:
              if line.startswith("uses-permission"):
                  match = re.search(r"name='([^']+)'", line)
                  if not match:
                      raise SystemExit("Unrecognized permission output: " + line)
                  actual.add(match.group(1))
          if actual != expected:
              raise SystemExit(f"Packaged permissions changed: unexpected={actual-expected}, missing={expected-actual}")
          print("Packaged permission allowlist verified")
          PY
          echo "Development debug artifact only; not a production update"
          sha256sum "$APK" | tee apk-sha256.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          stat -c 'APK size: %s bytes' "$APK"

      - name: Android lint
        working-directory: BatteryScope
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Capture resolved dependency inventory
        working-directory: BatteryScope
        run: gradle --no-daemon --stacktrace :app:reportResolvedDependencies

      - name: Upload APK and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BatteryScope-debug-${{ github.sha }}
          path: |
            BatteryScope/app/build/outputs/apk/debug/app-debug.apk
            BatteryScope/app/build/reports/tests/testDebugUnitTest/
            BatteryScope/app/build/test-results/testDebugUnitTest/
            BatteryScope/apk-badging.txt
            BatteryScope/apk-sha256.txt
            BatteryScope/apk-signing.txt
            BatteryScope/app/build/reports/lint-results-debug.*
            BatteryScope/app/build/reports/dependencies/resolved-debug.txt
          if-no-files-found: warn
          retention-days: 14

  android-instrumentation:
    name: Android 12L emulator database and restore tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's legacy default includes the retired "tools" package.
          # Request only platform-tools; command-line tools are installed by the action.
          packages: platform-tools

      - name: Install Android 35 SDK packages
        run: |
          # Keep the SDK manager's exit code while avoiding SIGPIPE from yes.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Install emulator and Android 12L image
        run: |
          sdkmanager "emulator" "system-images;android-32;google_apis;x86_64"
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          # Use one explicit AVD location for the Java tools and native emulator.
          export ANDROID_USER_HOME="$RUNNER_TEMP/batteryscope-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | avdmanager create avd --force --name batteryscope-ci --package "system-images;android-32;google_apis;x86_64" --path "$ANDROID_AVD_HOME/batteryscope-ci.avd"
          test -f "$ANDROID_AVD_HOME/batteryscope-ci.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx batteryscope-ci
      - name: Boot isolated test emulator
        run: |
          LOG="$RUNNER_TEMP/batteryscope-emulator.log"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then adb devices -l || true; tail -n 150 "$LOG" || true; fi' EXIT
          "$EMULATOR" -accel-check
          "$EMULATOR" -avd batteryscope-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel on > "$LOG" 2>&1 &
          EMULATOR_PID=$!
          adb start-server
          deadline=$((SECONDS + 600))
          until [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ]; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator exited before Android finished booting" >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Android emulator boot timed out" >&2
              exit 1
            fi
            sleep 3
          done
          adb shell input keyevent 82
      - name: Run Android instrumentation tests
        working-directory: BatteryScope
        run: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BatteryScope-instrumentation-${{ github.sha }}
          path: |
            BatteryScope/app/build/reports/androidTests/connected/
            BatteryScope/app/build/outputs/androidTest-results/connected/
            ${{ runner.temp }}/batteryscope-emulator.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop test emulator
        if: always()
        run: adb emu kill || true
